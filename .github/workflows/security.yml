name: security
on: [push, pull_request]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # GATE: Fails the build if a secret is found
      - name: Secret scan (Gitleaks)
        run: |
          docker run -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --exit-code 1 -v

      # GATE: Fails the build if bad code is found (remove --error to make it a Report)
      - name: SAST (Semgrep)
        if: always()
        run: |
          pip install semgrep
          semgrep scan --config auto --error

      # REPORT: Logs vulnerable libraries without failing the build
      - name: Dependency scan (Trivy)
        if: always()
        run: |
          docker run -v "${{ github.workspace }}:/repo" aquasec/trivy:latest \
            fs --scanners vuln --exit-code 0 /repo
